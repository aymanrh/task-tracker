<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Task Tracker</h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search..." hidden />
      <button id="new-task-btn" class="btn primary">+ New task</button>
    </div>
  </header>

  <main id="board" class="board">
    <!-- columns injected by app.js -->
  </main>

  <!-- Task modal -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">New task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <label>Title
          <input id="f-title" type="text" required />
        </label>
        <label>Description
          <textarea id="f-description" rows="2"></textarea>
        </label>
        <div class="row">
          <label>Status
            <select id="f-status">
              <option value="todo">To do</option>
              <option value="in_progress">In progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label>Priority
            <select id="f-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <label>Assignee
          <input id="f-assignee" type="text" />
        </label>
        <!-- feature fields injected here by app.js -->
        <div id="feature-fields"></div>
        <p id="form-error" class="error" hidden></p>
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
